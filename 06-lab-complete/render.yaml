# Render Blueprint — agent (Docker) + Key Value (Redis)
# Render Dashboard → New → Blueprint → chọn repo, Blueprint path: 06-lab-complete/render.yaml
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false            # nhập tay trên dashboard, không ghi vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: agent-redis
    plan: free
    region: singapore
    ipAllowList: []            # chỉ cho kết nối nội bộ từ service trên Render
    maxmemoryPolicy: noeviction
