# Railway — deploy từ thư mục 06-lab-complete: `railway up`
# Biến môi trường đặt trên Railway (không ghi ở đây):
#   AGENT_API_KEY, REDIS_URL=${{Redis.REDIS_URL}}, ENVIRONMENT=production
# Railway tự cấp PORT; CMD trong Dockerfile lắng nghe ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
